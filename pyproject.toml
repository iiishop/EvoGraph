[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evograph"
version = "0.1.0"
description = "Evidence-aware project evolution planner"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3", "pywebview>=5,<7", "keyring>=25,<26", "pillow>=11,<13", "pypdf>=5,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
evograph = "evograph.__main__:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
evograph = ["resources/*.md"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
